name: Build PokéSave Editor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PokéSave Editor project
        uses: actions/checkout@v4

      - name: Checkout upstream PKHeX Everywhere with submodules
        uses: actions/checkout@v4
        with:
          repository: arleypadua/PKHeX.Everywhere
          ref: main
          path: _upstream
          submodules: recursive
          fetch-depth: 0

      - name: Apply PokéSave Editor UI and navigation
        shell: bash
        run: |
          set -euo pipefail
          cp custom/src/PKHeX.Web/Pages/Home.razor _upstream/src/PKHeX.Web/Pages/Home.razor
          cp custom/src/PKHeX.Web/Pages/Load.razor _upstream/src/PKHeX.Web/Pages/Load.razor
          cp custom/src/PKHeX.Web/Layout/MainLayout.razor _upstream/src/PKHeX.Web/Layout/MainLayout.razor
          cp custom/src/PKHeX.Web/wwwroot/index.html _upstream/src/PKHeX.Web/wwwroot/index.html
          cp custom/src/PKHeX.Web/wwwroot/css/app.css _upstream/src/PKHeX.Web/wwwroot/css/app.css
          cp custom/src/PKHeX.Web/Services/EditorConfigService.cs _upstream/src/PKHeX.Web/Services/EditorConfigService.cs

          python3 - <<'PY2'
          from pathlib import Path
          p = Path("_upstream/src/PKHeX.Web/Program.cs")
          text = p.read_text(encoding="utf-8-sig")
          marker = "builder.Services.AddScoped<EditorConfigService>();"
          if marker not in text:
              anchor = "builder.Services.AddScoped<GameService>();"
              if anchor not in text:
                  raise SystemExit("Could not find GameService registration anchor")
              text = text.replace(anchor, marker + "\n" + anchor, 1)
              p.write_text(text, encoding="utf-8")
          PY2
          mkdir -p _upstream/src/PKHeX.Web/wwwroot/admin
          cp -a custom/src/PKHeX.Web/wwwroot/admin/. _upstream/src/PKHeX.Web/wwwroot/admin/
          cp custom/.htaccess _upstream/src/PKHeX.Web/wwwroot/.htaccess

      - name: Configure relative base path
        working-directory: _upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("src/PKHeX.Web/Pages/EncounterSearch.razor"),
              Path("src/PKHeX.Web/Components/LoadGameComponent.razor"),
              Path("src/PKHeX.Web/Components/PlugIns/GenericPlugInFailureAlert.razor"),
              Path("src/PKHeX.Web/Components/PkHexFooter.razor"),
              Path("src/PKHeX.Web/Components/PrivacyPolicy/PrivacyPolicy_20250501.razor"),
              Path("src/PKHeX.Web/Components/PrivacyPolicy/PrivacyPolicy_20241126.razor"),
              Path("src/PKHeX.Web/Components/Auth/CloudPrivacyAgreementAction.razor"),
              Path("src/PKHeX.Web/Services/Plugins/PlugInRuntime.razor"),
              Path("src/PKHeX.Web/Extensions/NavigationManagerExtensions.cs"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8-sig")
              replacements = {
                  'Navigation.NavigateTo("/")': 'Navigation.NavigateTo("./")',
                  'navigation.NavigateTo("/")': 'navigation.NavigateTo("./")',
                  'NavigateTo("/load"': 'NavigateTo("load"',
                  'NavigateTo("/items"': 'NavigateTo("items"',
                  'NavigateTo($"/pokemon/': 'NavigateTo($"pokemon/',
                  'NavigateTo($"/plugins/': 'NavigateTo($"plugins/',
                  'NavigateTo($"/analytics': 'NavigateTo($"analytics',
                  'NavigateTo($"/save': 'NavigateTo($"save',
                  'NavigateTo($"/settings': 'NavigateTo($"settings',
                  'NavigateTo($"/s/': 'NavigateTo($"s/',
                  'NavigateTo($"/cloud/': 'NavigateTo($"cloud/',
                  'NavigateTo($"/release-notes': 'NavigateTo($"release-notes',
                  'NavigateTo("/pokemon-box"': 'NavigateTo("pokemon-box"',
                  'NavigateTo("/pokemon/search-encounter"': 'NavigateTo("pokemon/search-encounter"',
                  'NavigateTo("/pokemon/selected-encounter"': 'NavigateTo("pokemon/selected-encounter"',
                  'NavigateTo("/pokemon/loaded-file"': 'NavigateTo("pokemon/loaded-file"',
                  'NavigateTo("/plugins/errors"': 'NavigateTo("plugins/errors"',
                  'NavigateTo("/plugins"': 'NavigateTo("plugins"',
                  'href="/': 'href="',
                  'GetByteArrayAsync("/data/': 'GetByteArrayAsync("data/',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          index = Path("src/PKHeX.Web/wwwroot/index.html")
          text = index.read_text(encoding="utf-8-sig")
          text = text.replace('<base href="/"/>', '<base href="./"/>')
          text = text.replace('<base href="/saveeditor/"/>', '<base href="./"/>')
          text = text.replace('href="/favicon.svg"', 'href="favicon.svg"')
          index.write_text(text, encoding="utf-8")
          PY
          echo "Configured Blazor base path: relative ./ (auto-detects install folder)"
          grep -q 'href="plugins"' ../_upstream/src/PKHeX.Web/Layout/MainLayout.razor
          grep -q 'href="analytics"' ../_upstream/src/PKHeX.Web/Layout/MainLayout.razor
          grep -q 'href="save"' ../_upstream/src/PKHeX.Web/Layout/MainLayout.razor
          echo "Verified Plugins, Analytics and Save navigation."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build React page assets
        working-directory: _upstream
        shell: bash
        run: |
          set -euo pipefail
          cd src/PKHeX.Web.React
          npm ci
          npm run build
          test -f ../PKHeX.Web/wwwroot/react/pages.js
          echo "Verified React page bundle: src/PKHeX.Web/wwwroot/react/pages.js"

      - name: Build JavaScript assets
        working-directory: _upstream
        shell: bash
        run: |
          set -euo pipefail
          cd src/PKHeX.Web/_js
          npm ci
          npm run build
          cd ../_blog
          npm ci
          npm run build

      - name: Restore .NET dependencies
        working-directory: _upstream
        run: dotnet restore

      - name: Build
        working-directory: _upstream
        run: dotnet build --no-restore -c Release

      - name: Publish website
        working-directory: _upstream
        run: |
          dotnet publish src/PKHeX.Web/PKHeX.Web.csproj -c Release -o publish

      - name: Verify static website
        working-directory: _upstream
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/wwwroot/index.html
          test -d publish/wwwroot/_framework
          test -f publish/wwwroot/react/pages.js
          test -f publish/wwwroot/.htaccess
          echo "Verified React page bundle: publish/wwwroot/react/pages.js"
          echo "PokéSave Editor website is ready."

      - name: Upload DirectAdmin-ready website
        uses: actions/upload-artifact@v4
        with:
          name: pokesave-editor-site
          path: _upstream/publish/wwwroot
          if-no-files-found: error
